<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Circular Light Blue Background -->
  <circle cx="100" cy="100" r="90" fill="#d9e6eb"/>
  
  <!-- Experimentation / Flask Icon -->
  <g fill="none" stroke="#1d2a32" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <!-- Erlenmeyer Flask Outline -->
    <path d="M 85,55 L 115,55 M 92,55 L 92,80 L 65,135 C 60,145 68,155 80,155 L 120,155 C 132,155 140,145 135,135 L 108,80 L 108,55" />
    
    <!-- Flask Liquid Base Line -->
