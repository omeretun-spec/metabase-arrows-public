  </g>
  
  <!-- Bubbles coming out of the flask -->
  <circle cx="95" cy="42" r="4" fill="#13697d"/>
  <circle cx="106" cy="32" r="3" fill="#13697d"/>
  <circle cx="98" cy="22" r="2" fill="#13697d"/>
